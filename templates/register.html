<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(0, 255, 128, 0.15) 0%, transparent 50%);
      pointer-events: none;
      animation: float 15s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(-30px, 30px) rotate(5deg); }
      66% { transform: translate(20px, -20px) rotate(-5deg); }
    }
    
    .container {
      max-width: 450px;
      position: relative;
      z-index: 1;
    }
    
    .register-card {
      background: rgba(20, 20, 40, 0.8);
      padding: 50px 40px;
      border-radius: 20px;
      border: 2px solid rgba(0, 255, 255, 0.3);
      box-shadow: 
        0 0 60px rgba(0, 255, 255, 0.4),
        0 0 100px rgba(255, 0, 255, 0.2),
        inset 0 0 60px rgba(0, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      animation: slideIn 0.8s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    h2 {
      font-weight: 900;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #00ffff, #00ff80, #00ffff);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 3s linear infinite;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }
    
    @keyframes gradient {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    
    .form-control {
      background: rgba(10, 10, 30, 0.8);
      border: 2px solid rgba(255, 0, 255, 0.3);
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
    }
    
    .form-control:focus {
      background: rgba(10, 10, 30, 0.9);
      border-color: #ff00ff;
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);
      color: #fff;
      outline: none;
    }
    
    .form-control::placeholder {
      color: rgba(255, 0, 255, 0.5);
      font-family: 'Orbitron', sans-serif;
    }
    
    .btn-success {
      background: linear-gradient(135deg, #00ff80, #00ffff);
      border: none;
      padding: 15px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
      color: #000;
    }
    
    .btn-success::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .btn-success:hover::before {
      width: 400px;
      height: 400px;
    }
    
    .btn-success:hover {
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
      transform: translateY(-3px);
    }
    
    .mt-3 {
      text-align: center;
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.7);
    }
    
    .mt-3 a {
      color: #ff00ff;
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
      transition: all 0.3s ease;
    }
    
    .mt-3 a:hover {
      color: #00ffff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
    }
    
    .glow-icon {
      text-align: center;
      font-size: 4rem;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6));
      }
      50% {
        transform: scale(1.1);
        filter: drop-shadow(0 0 40px rgba(0, 255, 128, 0.8));
      }
    }
    
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #00ffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffff;
      animation: float-particle 10s linear infinite;
    }
    
    @keyframes float-particle {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(100px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <div class="register-card">
      <div class="glow-icon">✨</div>
      <h2>Register</h2>
      <form method="POST">
        <input type="text" name="username" class="form-control" placeholder="Username" required>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <button type="submit" class="btn btn-success">Register</button>
      </form>
      <p class="mt-3">Already have an account? <a href="/login">Login here</a></p>
    </div>
  </div>
  
  <script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
