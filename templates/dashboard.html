<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h2>Sentiment Analysis Dashboard</h2>

  <form method="POST" action="/analyze">
    <input type="text" name="link" class="form-control mb-2" placeholder="Paste YouTube, Twitter, Instagram, or video link" required>
    <button type="submit" class="btn btn-info">Analyze</button>
  </form>

  {% if sentiment %}
    <div class="alert alert-info mt-4">
      <h5>Sentiment Result</h5>
      <p>{{ sentiment }}</p>
    </div>
  {% endif %}

  <p class="mt-3"><a href="/logout">Logout</a></p>
</body>
</html>
